name: profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate profile cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_stats.py
      - name: Commit changed cards
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/top-languages.svg; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/github-stats.svg assets/top-languages.svg
          git commit -m "chore(profile): refresh GitHub stats"
          git push
